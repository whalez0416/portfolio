<title>04 · 저니 톤 3D 프로토타입 — 갈림길</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<!--
  갈림길(5장)을 저니 톤으로 만든 프로토타입입니다. 판단용이고, index.html은 안 건드립니다.

  확인하려는 것 딱 세 가지:
    1. 굽이치는 언덕 위를 달리는 게 곧은 리본 위보다 나은가
    2. 로브 + 스카프가 "뒤에서 본 달리는 사람"보다 나은가 (그건 세 번 실패했습니다)
    3. 화면 가운데 큰 글자가 저니처럼 읽히는가

  의존성 0은 그대로입니다 — WebGL은 라이브러리가 아니라 브라우저 기본 기능이고,
  텍스처도 모델도 외부 파일이 아니라 전부 코드에서 만듭니다. 폰트만 예외입니다.

  플랫셰이딩은 법선을 안 넘깁니다. 프래그먼트에서 dFdx/dFdy로 면 법선을 구하기 때문에
  정점 버퍼에 위치만 있으면 되고, 그래서 지형도 로브도 스카프도 같은 셰이더를 씁니다.
-->
<style>
  html, body { margin: 0; height: 100%; background: #14100E; overflow: hidden; }
  #gl { display: block; width: 100vw; height: 100vh; }

  /* 저니식 자막 — UI는 0인데 서사만 가운데 뜬다.
     얇고, 자간 넓고, 아주 천천히 나타났다 사라진다. 이게 요점이라 공들였습니다. */
  .say {
    position: fixed; inset: 0; display: grid; place-items: center;
    pointer-events: none; padding: 0 8vw; text-align: center;
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
  }
  .say b {
    font-weight: 300; font-size: clamp(1.5rem, 3.6vw, 3rem); line-height: 1.5;
    letter-spacing: .06em; color: #FFF6E6;
    text-shadow: 0 2px 40px rgba(0,0,0,.75), 0 0 90px rgba(0,0,0,.5);
    opacity: 0; transition: opacity 2.6s ease;
  }
  .say b.on { opacity: 1; }

  .hint {
    position: fixed; left: 0; right: 0; bottom: 22px; text-align: center;
    font: 300 13px/1.9 "Pretendard Variable", Pretendard, system-ui, sans-serif;
    letter-spacing: .18em; color: rgba(255,240,220,.34); pointer-events: none;
  }
  .badge {
    position: fixed; top: 18px; left: 22px;
    font: 400 12px/1.7 ui-monospace, Consolas, monospace;
    letter-spacing: .16em; color: rgba(255,240,220,.30);
  }

  /* 신전 앞에 섰을 때만 뜨는 한 줄. 이게 이 게임의 유일한 UI입니다. */
  .enter {
    position: fixed; left: 0; right: 0; bottom: 16%; text-align: center;
    font: 300 clamp(15px,1.5vw,20px)/1.8 "Pretendard Variable", Pretendard, system-ui, sans-serif;
    letter-spacing: .16em; color: rgba(255,236,204,.92); pointer-events: none;
    opacity: 0; transition: opacity .8s; text-shadow: 0 2px 24px rgba(0,0,0,.9);
  }
  .enter.on { opacity: 1; }
  .enter kbd {
    font: inherit; border: 1px solid rgba(255,236,204,.5); padding: .05em .5em; margin: 0 .3em;
  }

  /* 나침반 — 신전에서 나오면 어디가 어디인지 모르게 됩니다.
     지도라기보다 얇은 원판 하나: 진행 방향이 늘 위, 산이 목표 침, 신전이 점. */
  #nav {
    position: fixed; top: 20px; right: 22px; width: 116px; height: 116px;
    opacity: 0; transition: opacity 1.2s; pointer-events: none;
  }
  #nav.on { opacity: .9; }

  /* 신전 안 — 읽는 자리. 조작을 요구하지 않습니다. */
  .room {
    position: fixed; inset: 0; z-index: 5; overflow: auto;
    display: none; place-items: center; padding: 8vh 8vw;
    background: radial-gradient(120% 90% at 50% 40%, rgba(30,17,10,.94), rgba(9,6,5,.985));
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    opacity: 0; transition: opacity 1.1s;
  }
  .room.on { display: grid; opacity: 1; }
  .room > div { max-width: 46rem; }
  .room h2 {
    font: 400 13px/1.8 ui-monospace, Consolas, monospace;
    letter-spacing: .34em; color: #FFB84D; margin: 0 0 2.2rem;
  }
  .room .why {
    font-weight: 300; font-size: clamp(1.3rem, 2.7vw, 2.1rem); line-height: 1.55;
    letter-spacing: -.01em; color: #FFF6E6; margin: 0 0 2rem;
  }
  .room p {
    font-weight: 300; font-size: clamp(.95rem, 1.25vw, 1.1rem); line-height: 2.1;
    color: rgba(255,240,220,.62); margin: 0; white-space: pre-line;
  }
  .room .out {
    margin-top: 3rem; font: 300 13px/1.8 "Pretendard Variable", Pretendard, system-ui, sans-serif;
    letter-spacing: .2em; color: rgba(255,240,220,.34);
  }

  /* 엔딩 — 산기슭. 이력서를 읽는 세 부류에게 각자의 문을 보여줍니다. */
  #fin {
    position: fixed; inset: 0; z-index: 6; overflow: auto;
    display: none; place-items: center; padding: 8vh 8vw; text-align: center;
    background: radial-gradient(120% 90% at 50% 42%, rgba(28,16,10,.93), rgba(8,5,5,.985));
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    opacity: 0; transition: opacity 2.2s;
  }
  #fin.on { display: grid; opacity: 1; }
  #fin h2 { font-weight: 300; font-size: clamp(1.7rem,3.4vw,2.7rem); letter-spacing: -.01em;
            color: #FFF6E6; margin: 0 0 .6rem; }
  #fin .lede { font-weight: 300; font-size: clamp(1rem,1.6vw,1.25rem); color: #FFB84D;
               letter-spacing: .04em; margin: 0 0 2.6rem; }
  #fin .cnt { font: 300 13px/1.8 ui-monospace, Consolas, monospace; letter-spacing: .3em;
              color: rgba(255,240,220,.4); margin-bottom: 2.8rem; }
  #fin .doors { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 3rem; }
  #fin .doors div {
    border: 1px solid rgba(255,238,210,.22); padding: 1.1rem 1.5rem; min-width: 13rem;
    text-align: left;
  }
  #fin .doors b { display: block; font-weight: 500; font-size: 1rem; color: #FFF6E6;
                  letter-spacing: .06em; margin-bottom: .35rem; }
  #fin .doors span { font-weight: 300; font-size: .82rem; line-height: 1.7;
                     color: rgba(255,240,220,.55); }
  #fin button {
    font: 300 14px/1 "Pretendard Variable", Pretendard, system-ui, sans-serif;
    letter-spacing: .22em; color: rgba(255,240,220,.75);
    background: none; border: 1px solid rgba(255,238,210,.3); padding: .8rem 2.2rem;
    cursor: pointer;
  }
  #fin button:hover { color: #FFF6E6; border-color: rgba(255,238,210,.6); }
</style>

<canvas id="gl"></canvas>
<div class="say"><b id="line"></b></div>
<div class="badge">2014</div>
<div class="hint" id="hint">↑ 걷기 &nbsp;·&nbsp; ← → 방향 &nbsp;·&nbsp; 산 쪽으로, 유적을 찾아보세요</div>
<div class="enter" id="enter"></div>
<canvas id="nav" width="232" height="232"></canvas>
<div id="fin"><div>
  <h2>저는 여전히 마케터입니다</h2>
  <p class="lede">다만 이제, 팔 것을 직접 만듭니다.</p>
  <p class="cnt" id="fin-cnt"></p>

    <div><b>채용</b><span>이런 걸 만드는 사람이<br>필요하시면</span></div>
    <div><b>영업</b><span>병원에 맞춰 만든 것들입니다<br>돌려보고 싶으시면</span></div>
    <div><b>창업 · 투자</b><span>이 밸류체인을 제품으로<br>만드는 이야기라면</span></div>
  </div>

</div></div>

  <h2 id="room-name"></h2>

  <p class="out">⏎ 또는 Esc — 나가기</p>
</div></div>

<script>
/* ═══════════ 최소 행렬 ═══════════ */
const TAU = Math.PI * 2;
const M4 = () => new Float32Array(16);
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), o = M4();
  o[0] = f / aspect; o[5] = f; o[11] = -1;
  o[10] = (far + near) / (near - far); o[14] = 2 * far * near / (near - far);
  return o;
}
function lookAt(e, c, up) {
  let zx = e[0]-c[0], zy = e[1]-c[1], zz = e[2]-c[2];
  let l = Math.hypot(zx,zy,zz) || 1; zx/=l; zy/=l; zz/=l;
  let xx = up[1]*zz - up[2]*zy, xy = up[2]*zx - up[0]*zz, xz = up[0]*zy - up[1]*zx;
  l = Math.hypot(xx,xy,xz) || 1; xx/=l; xy/=l; xz/=l;
  const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
  const o = M4();
  o[0]=xx; o[1]=yx; o[2]=zx; o[4]=xy; o[5]=yy; o[6]=zy; o[8]=xz; o[9]=yz; o[10]=zz;
  o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);
  o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);
  o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);
  o[15]=1; return o;
}
function mul(a, b) {                       /* a * b */
  const o = M4();
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0; for (let k = 0; k < 4; k++) s += a[k*4+r] * b[c*4+k];
    o[c*4+r] = s;
  }
  return o;
}
function ident(){const o=M4();o[0]=o[5]=o[10]=o[15]=1;return o;}
function rotX(t){const c=Math.cos(t),s=Math.sin(t),o=M4();
  o[0]=1;o[5]=c;o[6]=s;o[9]=-s;o[10]=c;o[15]=1;return o;}
function rotZ(t){const c=Math.cos(t),s=Math.sin(t),o=M4();
  o[0]=c;o[1]=s;o[4]=-s;o[5]=c;o[10]=1;o[15]=1;return o;}
function trs(tx, ty, tz, ry, s) {
  const co = Math.cos(ry), si = Math.sin(ry), o = M4();
  o[0]=co*s; o[2]=-si*s; o[5]=s; o[8]=si*s; o[10]=co*s;
  o[12]=tx; o[13]=ty; o[14]=tz; o[15]=1; return o;
}

/* ═══════════ 지형 — 셰이더와 JS가 같은 식을 씁니다 ═══════════
   같은 높이 함수를 두 군데에 쓰는 건 위험한데, 인물이 지면에 붙어야 하므로
   CPU에도 필요합니다. 그래서 GLSL 문자열 하나를 만들어 양쪽에 씁니다. */
const PATH = `
/* 정해진 길이 없습니다. 예전엔 pathX(z) 를 따라 골짜기를 파 두고 그 위를
   자동으로 달렸는데, 직접 걷게 되면 "정해진 z 방향"이라는 게 성립하지 않습니다.
   트인 사막이라야 어디로 갈지가 실제로 내 선택이 되고, 방향은 지평선의 산이 줍니다. */
float dunes(vec2 p){
  float y = 0.0;
  y += 7.0*sin(p.x*0.0125 + 1.3)*cos(p.y*0.0102 - 0.4);   /* 풍경 전체의 큰 기복 */
  y += 3.2*sin(p.x*0.0570 - p.y*0.0410 + 2.1);            /* 실제로 넘어가는 언덕 */
  /* 등성이 — 사인 언덕은 어디나 둥글어서 사막이 아니라 구릉이 됩니다.
     1-|sin| 은 마루가 접혀서, 플랫셰이딩이 그 자리에 칼같은 빛/그늘 경계를
     만듭니다. 저니 사막의 그 초승달 능선입니다. */
  y += 1.7*(1.0 - abs(sin(p.x*0.0310 - p.y*0.0170 + 0.8)));
  y += 1.00*sin(p.x*0.1300 + p.y*0.1050 - 1.1);
  y += 0.28*sin(p.x*0.3100 - p.y*0.2700);
  return y;
}
float height(vec2 p){ return dunes(p); }`;

/* JS 쪽 — 위 GLSL과 계수가 같아야 합니다 */
function height(x, z) {
  return 7.0*Math.sin(x*0.0125+1.3)*Math.cos(z*0.0102-0.4)
       + 3.2*Math.sin(x*0.0570 - z*0.0410 + 2.1)
       + 1.7*(1.0 - Math.abs(Math.sin(x*0.0310 - z*0.0170 + 0.8)))   /* 등성이 — GLSL과 동일 */
       + 1.00*Math.sin(x*0.1300 + z*0.1050 - 1.1)
       + 0.28*Math.sin(x*0.3100 - z*0.2700);
}
/* 카메라가 지형을 1:1로 따라가면 언덕마다 위아래로 채질을 합니다.
   앞쪽 몇 지점을 같이 평균 내서 "대충 이 근처 땅높이"를 만들고, 카메라는
   그걸 천천히 따라갑니다 — 어지러움의 두 번째 원인이 이거였습니다. */
function groundAvg(x, z, fx, fz) {
  let s = 0;
  for (let i = 0; i < 5; i++) s += height(x + fx*i*7, z + fz*i*7);
  return s / 5;
}

/* ═══════════ WebGL ═══════════ */
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', { antialias: true, alpha: false });
if (!gl) {
  document.body.innerHTML =
    '<p style="color:#E8D9C0;font:16px/1.8 system-ui;padding:3rem">이 브라우저에 WebGL2가 없습니다. ' +
    '크롬·엣지·파이어폭스 최신 버전에서 열어주세요.</p>';
  throw new Error('no webgl2');
}

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src);
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

/* 하늘 — 화면 전체 삼각형 하나. 깊이 없이 먼저 칠합니다. */
const skyProg = program(`#version 300 es
out vec2 vUv;
void main(){
  vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2);
  vUv = p; gl_Position = vec4(p*2.0-1.0, 0.999, 1.0);
}`, `#version 300 es
precision highp float;
in vec2 vUv; out vec4 frag;
uniform vec3 uHaze, uHigh; uniform float uSunX;
void main(){
  float t = clamp(vUv.y, 0.0, 1.0);
  vec3 c = mix(uHaze, uHigh, pow(t, 0.85));
  /* 해 — 원반이 있고, 그 둘레에 두 겹의 번짐. 번짐만 있으면 "밝은 곳"이고
     원반이 있어야 "해"입니다. 저니는 늘 해가 지평선 근처에 걸려 있습니다. */
  vec2 sp = vec2(uSunX, 0.115);
  float d = distance(vec2(vUv.x, vUv.y*1.9), sp);
  c += vec3(1.00,0.72,0.34) * exp(-d*d*7.0)  * 0.55;
  c += vec3(1.00,0.60,0.25) * exp(-d*d*90.0) * 0.85;
  c += vec3(1.00,0.92,0.75) * smoothstep(0.052, 0.038, d);
  /* 노을 구름 — 얇은 띠 두 줄. 아랫면만 해에 그을려 있습니다.
     빈 그라데이션 하늘은 스크린세이버지 장면이 아닙니다. */
  float w1 = vUv.y - 0.30 - 0.045*sin(vUv.x*5.1 + 1.2) - 0.015*sin(vUv.x*13.0);
  float b1 = smoothstep(0.030, 0.006, abs(w1));
  c = mix(c, vec3(0.34,0.19,0.26), b1*0.42);
  c += vec3(0.95,0.45,0.22) * smoothstep(0.018, 0.002, abs(w1+0.012)) * 0.30;
  float w2 = vUv.y - 0.445 - 0.03*sin(vUv.x*3.4 - 0.7) - 0.012*sin(vUv.x*9.5+2.0);
  float b2 = smoothstep(0.022, 0.005, abs(w2));
  c = mix(c, vec3(0.27,0.17,0.26), b2*0.34);
  /* 디더 — 8비트 그라데이션 줄무늬(밴딩)를 잘게 부숩니다. 마감의 반은 이런 것 */
  c += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453) - 0.5) * (2.0/255.0);
  frag = vec4(c, 1.0);
}`);

/* 지형·인물·스카프가 전부 같은 셰이더를 씁니다. 위치만 넘기고 법선은
   프래그먼트에서 미분으로 구하므로, 무엇을 그리든 자동으로 플랫셰이딩입니다. */
const litVS = `#version 300 es
in vec3 aPos;
uniform mat4 uVP, uModel;
uniform vec2 uOrigin;
uniform vec3 uCam;
uniform int uTerrain;
out vec3 vW;    /* 월드 좌표 — 안개와 모래 결처럼 저주파에만 씁니다 */
out vec3 vRel;  /* 카메라 기준 좌표 — 인물·신전 법선은 이걸로 뽑습니다 */
flat out float vTer;
${PATH}
void main(){
  vec3 w;
  if (uTerrain == 1) { vec2 p = aPos.xz + uOrigin; w = vec3(p.x, height(p), p.y); }
  else               { w = (uModel * vec4(aPos,1.0)).xyz; }
  vW = w; vRel = w - uCam; vTer = float(uTerrain);
  gl_Position = uVP * vec4(w,1.0);
}`;
const litFS = `#version 300 es
precision highp float;
${PATH}
flat in float vTer;
in vec3 vW; in vec3 vRel; out vec4 frag;
uniform vec3 uCam, uSun, uLit, uDark, uHaze;
uniform float uFog, uGlit, uEmit;
void main(){
  float dE = length(vRel);
  /* 스스로 빛나는 면 — 신전 입구에서 새어 나오는 빛입니다.
     빛 계산을 태우면 문간이 그냥 어두운 구멍이 되고, 멀리서 "저기 뭔가 있다"가
     안 보입니다. 저니의 유적은 항상 입구가 빛나고 있어서 눈에 걸립니다. */
  if (uEmit > 0.5) {
    float fE = 1.0 - exp(-dE*dE*uFog*0.35);
    frag = vec4(mix(uLit, uHaze, clamp(fE,0.0,1.0)), 1.0);
    return;
  }
  vec3 n;
  if (vTer > 0.5) {
    /* 지형은 픽셀마다 높이 함수의 진짜 기울기로 법선을 계산합니다.
       면 법선(dFdx/dFdy)은 2.6단위 격자를 그대로 드러내서, 사막 전체가
       다이아몬드 체크무늬가 됐습니다 — 프로그래머 아트의 상징입니다.
       높이 함수가 셰이더 안에 있으니 격자는 자리만 잡고 음영은 해석적으로:
       언덕이 매끈하게 흐르고, 접힌 등성이의 불연속만 칼로 남습니다. */
    float e = 0.35;
    float hx = height(vW.xz + vec2(e,0.0)) - height(vW.xz - vec2(e,0.0));
    float hz = height(vW.xz + vec2(0.0,e)) - height(vW.xz - vec2(0.0,e));
    n = normalize(vec3(-hx, 2.0*e, -hz));
  } else {
    /* 인물·신전은 카메라 기준 면 법선. 월드 좌표로 뽑으면 float32 정밀도에
       묻혀 벽이 자글거리고(z 300+), 부호는 화면상 감김에 따라 뒤집히므로
       보이는 면의 법선은 카메라 쪽을 향한다는 것만 강제합니다. */
    n = normalize(cross(dFdx(vRel), dFdy(vRel)));
    if (dot(n, vRel) > 0.0) n = -n;
  }
  float d = max(dot(n, normalize(uSun)), 0.0);
  /* 만화의 자리는 여기입니다: 명암을 3.5단으로 끊되 단 사이를 부드럽게 넘깁니다.
     화면 필터와 달리 빛의 지형(언덕 능선)을 따라 끊기므로, 얼룩이 아니라
     "칠한 면"이 됩니다. 절반만 섞어 3D 의 부피감도 남깁니다. */
  float q = d * 3.5;
  float dq = (floor(q) + smoothstep(0.30, 0.70, fract(q))) / 3.5;
  d = mix(d, dq, 0.55);
  vec3 c = mix(uDark, uLit, pow(d, 0.85));
  float dist = dE;
  /* 모래 결과 반짝임. 저니 사막의 절반은 이겁니다 — 없으면 그냥 갈색 언덕이고,
     실제로 근경이 주황색 그라데이션처럼 텅 비어 보였습니다.
     결은 지오메트리가 아니라 음영으로 냅니다: 정점을 안 건드리니 CPU와
     높이를 맞출 필요가 없고, 멀리서 계단 현상도 안 납니다. */
  if (uGlit > 0.0) {
    float near = exp(-dist/160.0);
    float r1 = sin(vW.x*0.42 + vW.z*0.13)*0.5 + 0.5;      /* 넓은 풍문(風紋) */
    float r2 = sin(vW.x*0.29 - vW.z*0.97 + 1.7)*0.5 + 0.5;
    float r3 = sin(vW.x*2.10 + vW.z*0.70 - 0.6)*0.5 + 0.5;
    c *= 1.0 + (r1*0.20 + r2*0.15 + r3*0.06 - 0.205) * near;
    /* 바람 — 모래 결이 표면 위를 흘러갑니다. 두 사인의 곱이라 물결이 아니라
       띄엄띄엄 지나가는 모래 바람으로 읽히고, 수평면에만 얹어 언덕 벽면이
       일렁이는 것을 막습니다. 사막이 "살아 있다"는 인상은 대부분 이겁니다. */
    float wg = smoothstep(0.55, 0.9, n.y) * near;
    float w1 = sin(vW.x*0.55 + vW.z*1.35 - uTime*2.1);
    float w2 = sin(vW.x*0.13 - vW.z*0.31 + uTime*0.5);
    c *= 1.0 + w1*max(0.0,w2)*0.055*wg;
    /* 반짝이는 티끌이어야지 조명판이면 안 됩니다 — 3.4 셀 · 2% · 세기 30 은
       사막이 LED 전광판이 됐습니다. 알갱이는 잘게, 드물게, 은은하게. */
    float g = fract(sin(dot(floor(vW.xz*9.0), vec2(12.9898,78.233)))*43758.5453);
    float spec = pow(max(dot(reflect(-normalize(uSun), n), normalize(uCam - vW)), 0.0), 22.0);
    c += vec3(1.0,0.86,0.6) * step(0.994, g) * spec * uGlit * 7.0 * near;
    /* 해를 향해 걸을 때 사막 전체에 깔리는 반짝임 띠 — 저니의 그 바다 같은 면 */
    c += vec3(1.0,0.80,0.50) * spec * uGlit * 0.55;
  }
  /* 접지 그림자 — 인물 발밑의 부드러운 타원. 06 시트에서 "이게 없으면 무엇을
     해도 떠 보인다"라고 적어 놓고 정작 사막에는 이식을 빼먹었습니다. 그게
     "공중에 떠 있는 느낌"의 정체였습니다. 높이로 게이트를 걸어 신전 벽면까지
     어두워지는 것을 막습니다. */
  float sd = length(vW.xz - uPXZ);
  float gate = smoothstep(uPY + 0.6, uPY + 0.15, vW.y);
  c *= 1.0 - 0.62 * exp(-sd*sd*2.4) * gate;
  float f = 1.0 - exp(-dist*dist*uFog);
  frag = vec4(mix(c, uHaze, clamp(f,0.0,1.0)), 1.0);
}`;
const lit = program(litVS.replace('uniform vec3 uCam;',
  'uniform vec3 uCam;'),
  litFS.replace('uniform float uFog, uGlit, uEmit;',
  'uniform float uFog, uGlit, uEmit, uPY, uTime;\nuniform vec2 uPXZ;'));

/* 멀리 있는 산 — 저니는 처음부터 끝까지 목표가 지평선에 보입니다.
   안개를 거의 안 먹여서, 뿌옇지만 절대 사라지지 않게 둡니다. */
const farProg = program(`#version 300 es
in vec3 aPos; uniform mat4 uVP, uModel; uniform vec3 uCam; out vec3 vW; out float vLY;
void main(){ vec3 w = (uModel*vec4(aPos,1.0)).xyz; vW = w - uCam; vLY = aPos.y;
  gl_Position = uVP*vec4(w,1.0); }`,
`#version 300 es
precision highp float;
in vec3 vW; in float vLY; out vec4 frag;
uniform vec3 uHaze, uTint; uniform float uMix;
void main(){
  vec3 n = normalize(cross(dFdx(vW), dFdy(vW)));
  float d = max(dot(n, normalize(vec3(0.5,0.55,0.66))), 0.0);
  /* 종이 오리감의 정체: 균일하게 뿌연 삼각형. 진짜 먼 산은 발치가 대기에
     잠기고 봉우리로 갈수록 또렷해집니다 — 그 수직 그라데이션 하나가
     산을 공기 안에 앉힙니다. */
  float ground = smoothstep(0.02, 0.55, vLY);
  float k = uMix * (0.35 + 0.9*ground);
  frag = vec4(mix(uHaze, uTint*(0.50+0.50*d), clamp(k, 0.0, 1.0)), 1.0);
}`);

const U = (p, n) => gl.getUniformLocation(p, n);
const uni = {
  sky:  { haze: U(skyProg,'uHaze'), high: U(skyProg,'uHigh'), sunX: U(skyProg,'uSunX') },
  lit:  { vp:U(lit,'uVP'), model:U(lit,'uModel'), origin:U(lit,'uOrigin'), terrain:U(lit,'uTerrain'),
          cam:U(lit,'uCam'), sun:U(lit,'uSun'), litc:U(lit,'uLit'), dark:U(lit,'uDark'),
          haze:U(lit,'uHaze'), fog:U(lit,'uFog'), glit:U(lit,'uGlit'), emit:U(lit,'uEmit'),
          pxz:U(lit,'uPXZ'), py:U(lit,'uPY'), time:U(lit,'uTime') },
  far:  { vp:U(farProg,'uVP'), model:U(farProg,'uModel'), haze:U(farProg,'uHaze'),
          tint:U(farProg,'uTint'), mix:U(farProg,'uMix'), cam:U(farProg,'uCam') }
};

function mesh(arr) {
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  return { vao, n: arr.length / 3, buf };
}

/* ── 지형 격자. 카메라를 따라다니되 높이는 월드 좌표로 뽑으므로
      언덕은 제자리에 있고 우리가 그 위를 지나갑니다.

      간격이 일정한 격자를 쓰면 안 됩니다. 처음엔 1.35 간격 190칸(=128단위)이었는데,
      그러면 128단위 앞에서 지형이 뚝 끊기고 그 자리가 지평선처럼 보입니다.
      화면에 언덕이 한 겹밖에 안 남아서 사막이 아니라 평지가 됐습니다.
      그래서 거듭제곱으로 등급을 매깁니다 — 발밑은 촘촘하고 멀수록 성기게, 620단위까지.
      끝은 안개가 먹습니다. ── */
/* 간격이 일정한 격자입니다. 등급 격자(멀수록 성기게)를 썼더니 칸 크기가
   제각각이라 카메라 위치를 칸에 맞춰 스냅할 수가 없었고, 그러면 정점이 매 프레임
   지형 위를 미끄러집니다. 플랫셰이딩이라 그 미끄러짐이 화면 전체의 면을 계속
   갈아치우고, 바닥 전체가 잘게 기어다닙니다 — 어지러움의 제일 큰 원인이었습니다.
   일정 간격이면 카메라를 칸 단위로 스냅할 수 있고, 그러면 삼각형이 월드에
   완전히 고정돼 흔들림이 0이 됩니다. 정점은 더 쓰지만 그건 싼 값입니다. */
const CELL = 2.2, NX = 390, NZ = 272, ZBACK = 40;   /* 능선 실루엣이 각지지 않을 밀도 */
const terrain = (() => {
  const v = [], hx = NX*CELL/2;
  for (let i = 0; i < NX; i++) {
    const x0 = -hx + i*CELL, x1 = x0 + CELL;
    for (let j = 0; j < NZ; j++) {
      const z0 = -ZBACK + j*CELL, z1 = z0 + CELL;
      /* 감김 방향에 목숨이 걸려 있습니다. (x0,z0)->(x1,z0)->(x1,z1) 순으로 넣으면
         법선이 아래를 향해서, 위에서 내려다보는 면이 전부 백페이스로 잘립니다.
         그러면 경사가 가팔라 우연히 감김이 뒤집힌 면만 남고 — 화면에는 언덕 몇 겹만
         떠 있고 나머지는 전부 하늘이 됩니다. 인물이 허공에 서 있었습니다.
         하늘을 형광 초록으로 칠해 보고서야 알았습니다. */
      v.push(x0,0,z0, x1,0,z1, x1,0,z0,  x0,0,z0, x0,0,z1, x1,0,z1);
    }
  }
  return mesh(new Float32Array(v));
})();

/* ══════════ 인물 — 06-figure-sculpt 에서 확정한 조각을 그대로 이식 ══════════
   회전체가 아닙니다: 사다리꼴 로브 + 각진 크리스 + 열린 옷단 + 어깨 단차 + 꺾인 후드.
   지형과 달리 진짜 면 법선과 정점 AO·색을 가지므로 전용 셰이더(figProg)를 씁니다.
   조명도 06에서 확정한 세트: 반구 환경광 + 앞(노을)에서 오는 키 + 앰버 림 + 톤매핑. */
function FMesh(){ this.p=[]; this.n=[]; this.a=[]; this.c=[]; }
FMesh.prototype.tri=function(A,B,C,ao,ci){
  const ux=B[0]-A[0],uy=B[1]-A[1],uz=B[2]-A[2];
  const vx=C[0]-A[0],vy=C[1]-A[1],vz=C[2]-A[2];
  let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
  const l=Math.hypot(nx,ny,nz)||1; nx/=l;ny/=l;nz/=l;
  for(const Pt of [A,B,C]){ this.p.push(Pt[0],Pt[1],Pt[2]); this.n.push(nx,ny,nz);
    this.a.push(typeof ao==='function'?ao(Pt):(ao||0)); this.c.push(ci||0); }
};
FMesh.prototype.quad=function(A,B,C,D,ao,ci){ this.tri(A,B,C,ao,ci); this.tri(A,C,D,ao,ci); };

/* 기둥 성격(크리스·옷단 들림)은 시드 고정 — 프레임마다 흔들리면 젤리가 됩니다 */
const FIG_NS = 12, FIG_NY = 15;
const FIG_COL = [];
for (let i=0;i<=FIG_NS;i++){
  const h = Math.sin(i*127.1+3.7)*43758.5453, r1 = h-Math.floor(h);
  const h2 = Math.sin(i*269.5+1.3)*24634.6345, r2 = h2-Math.floor(h2);
  FIG_COL.push({ crease:(r1-0.5)*0.17 + (i%4===0?0.07:0), hem:r2*0.085 });   /* 멀리서도 실루엣이 패이게 */
}
FIG_COL[FIG_NS] = FIG_COL[0];
const FIG_SIL = [
  [.500,.030],[.468,.150],
  [.402,.430],[.335,.800],[.305,1.040],
  [.312,1.190],[.352,1.300],[.352,1.368],
  [.150,1.405],[.135,1.470]
];
const figR = y => {
  for (let k=0;k<FIG_SIL.length-1;k++){
    const [r0,y0]=FIG_SIL[k],[r1,y1]=FIG_SIL[k+1];
    if (y>=y0&&y<=y1) return r0+(r1-r0)*((y-y0)/(y1-y0));
  }
  return y<FIG_SIL[0][1] ? FIG_SIL[0][0] : FIG_SIL[FIG_SIL.length-1][0];
};
/* plain=true 는 무리용: 옷단 띠·눈금 없음. 그 차이가 곧 "나"입니다. */
function buildFigure(walk, ph, plain) {
  const m = new FMesh();
  /* 0.55 는 옷단이 너무 들려 속이 훤히 보였습니다 — 차임은 실루엣 가장자리에서
     읽히면 충분하고, 속을 보여주는 순간 손해만 봅니다. */
  const kick = walk * 0.28;
  const Y0=.03, Y1=1.47;
  const hemKick = (a,y) => {
    const back = Math.max(0, Math.cos(a-Math.PI/2));
    const low  = Math.max(0, 1 - y/0.55);
    return kick * back*back * low*low * (0.55 + 0.45*Math.sin(ph*2));
  };
  const P = (i,j) => {
    const a = i/FIG_NS*TAU, t = j/FIG_NY;
    const y = Y0+(Y1-Y0)*t;
    const deep = Math.max(0, 1 - y/1.42);
    const r = figR(y) * (1 + FIG_COL[i].crease*deep) + .012*Math.sin(a*2+ph*0.9)*deep;
    const lift = (FIG_COL[i].hem + hemKick(a,y)*0.30) * Math.max(0,1-t*3.2);
    const lean = 0.03*Math.max(0,(y-0.9));
    return [ r*Math.cos(a), y + lift, r*Math.sin(a) - lean + hemKick(a,y)*0.55 ];
  };
  const hemAO = Pt => Math.max(0, 1 - Pt[1]/1.35);
  for (let i=0;i<FIG_NS;i++) for (let j=0;j<FIG_NY;j++)
    m.quad(P(i,j), P(i+1,j), P(i+1,j+1), P(i,j+1), hemAO, 0);
  /* 옷단 안쪽 — 로브색에 짙은 AO. 처음엔 얼굴 구멍과 같은 새까만 색(c3)을
     썼는데, 걸으면서 옷단이 들릴 때마다 시커먼 속이 드러나 유령처럼 보였습니다.
     천의 안쪽은 어두운 "천"이지 공허가 아닙니다. */
  for (let i=0;i<FIG_NS;i++){
    const A=P(i,0), B=P(i+1,0);
    m.quad(B, A, [A[0]*.55,.015,A[2]*.55], [B[0]*.55,.015,B[2]*.55], .85, 0);
  }
  if (!plain) {
    for (let i=0;i<FIG_NS;i++){
      const A=P(i,0), B=P(i+1,0), C=P(i+1,1), D=P(i,1);
      const out = Q => [Q[0]*1.008, Q[1], Q[2]*1.008];
      const mid = (Q,W) => [ (Q[0]+W[0])/2*1.008, (Q[1]+W[1])/2, (Q[2]+W[2])/2*1.008 ];
      m.quad(out(A), out(B), mid(B,C), mid(A,D), .15, 1);
    }
    const radAt = (a,y) => {
      const deep = Math.max(0, 1 - y/1.42);
      return figR(y)*(1 + FIG_COL[Math.round(a/TAU*FIG_NS)%FIG_NS].crease*deep);
    };
    for (let i=0;i<FIG_NS*2;i++){
      const a=i/(FIG_NS*2)*TAU, major=i%5===0;
      const y0=.032, y1=major?.092:.062;
      const r0=radAt(a,y0)*1.02, r1=radAt(a,y1)*1.02, w=.006;
      const tx=-Math.sin(a), tz=Math.cos(a);
      m.quad([r0*Math.cos(a)-tx*w,y0,r0*Math.sin(a)-tz*w],
             [r0*Math.cos(a)+tx*w,y0,r0*Math.sin(a)+tz*w],
             [r1*Math.cos(a)+tx*w,y1,r1*Math.sin(a)+tz*w],
             [r1*Math.cos(a)-tx*w,y1,r1*Math.sin(a)-tz*w], 0, 2);
    }
  }
  const HOOD = [[.150,1.44],[.190,1.53],[.200,1.64],[.165,1.77],[.100,1.87],[.025,1.95]];
  const hood = (i,j) => {
    const a=i/10*TAU, r=HOOD[j][0], y=HOOD[j][1];
    const kink = Math.max(0,(y-1.62))*0.62;
    const rr = r*(1+.05*Math.sin(a*3+.8));
    return [rr*Math.cos(a), y, rr*Math.sin(a)+kink];
  };
  for (let i=0;i<10;i++) for (let j=0;j<HOOD.length-1;j++)
    m.quad(hood(i,j),hood(i+1,j),hood(i+1,j+1),hood(i,j+1), 0, 0);
  /* 얼굴 구멍 — 뒤에서는 안 보이고 3/4에서 사람이 됩니다 */
  for(let i=0;i<10;i++){
    const a0=i/10*TAU, a1=(i+1)/10*TAU, r=.135;
    m.tri([0,1.58,-.155],
          [Math.cos(a0)*r*.72, 1.58+Math.sin(a0)*r, -.165],
          [Math.cos(a1)*r*.72, 1.58+Math.sin(a1)*r, -.165], 0, 3);
  }
  return m;
}
let flow = 1;
function buildScarfMesh(t, drive, grow) {
  flow += (drive - flow) * 0.05;             /* 걷기 시작/멈춤에 천천히 반응 */
  /* 신전을 하나 들어가 볼 때마다 스카프가 조금씩 길어집니다 —
     성장이 HUD 숫자가 아니라 실루엣에 보이는 것, 이 게임의 원칙입니다. */
  const m=new FMesh(), N=26, L=(2.1 + (grow||0))*(0.45+0.55*flow);
  const pts=[], up=[];
  for(let i=0;i<=N;i++){
    const u=i/N;
    /* +z 가 뒤 — 스카프는 진행 반대(등 뒤 카메라 쪽)로 흐릅니다 */
    pts.push([ .40*u + Math.sin(t*2.1-u*5.2)*0.26*u,
               1.52 + 0.22*u*flow - 0.5*u*u*(1-flow) + Math.sin(t*3.0-u*4.1)*0.13*u,
               0.16 + u*L*0.72 + Math.cos(t*2.5-u*4.6)*0.08*u ]);
    up.push(Math.sin(u*6+t*2.2)*0.5);
  }
  for(let i=0;i<N;i++){
    const u0=i/N,u1=(i+1)/N;
    const w0=.072*(1-u0*.7)+.014, w1=.072*(1-u1*.7)+.014;
    const a=pts[i], b=pts[i+1];
    const A=[a[0]-w0,a[1]+up[i]*w0,a[2]], B=[a[0]+w0,a[1]-up[i]*w0,a[2]];
    const C=[b[0]+w1,b[1]-up[i+1]*w1,b[2]], D=[b[0]-w1,b[1]+up[i+1]*w1,b[2]];
    m.quad(A,B,C,D,0,2); m.quad(D,C,B,A,0,2);

}

/* 매 프레임 다시 채우는 동적 슬롯. VAO·버퍼를 프레임마다 만들면 GPU 메모리가 새서,
   고정 용량을 한 번 잡고 bufferSubData 로만 갱신합니다. */
function dynSlot(capVerts) {
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const mk = (loc, size) => {
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, capVerts*size*4, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
    return b;
  };
  const bP = mk(0,3), bN = mk(1,3), bA = mk(2,1), bC = mk(3,1);
  gl.bindVertexArray(null);
  return {
    vao, n: 0,
    set(m) {
      this.n = Math.min(capVerts, m.p.length/3);
      const put = (b, d) => { gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array(d)); };
      put(bP, m.p); put(bN, m.n); put(bA, m.a); put(bC, m.c);
    }
  };
}

/* 깃발 천 — 신전 앞 두 기둥 끝에서 펄럭입니다. 저니 유적의 서명 같은 물건이고,
   정지된 돌 무더기에 "지금도 바람이 분다"를 얹는 유일한 움직임입니다.
   월드 좌표로 직접 만들어 한 슬롯에 몰아 그립니다. */
function buildBanners(el2) {
  const m = new FMesh(), N = 14, L = 2.6;
  for (const t of TEMPLES) {
    if (Math.hypot(t.x - P0.x, t.z - P0.z) > 150) continue;
    const c = Math.cos(t.yaw), s = Math.sin(t.yaw);
    for (const side of [-1, 1]) {
      const lx = side*7.25, lz = -7.1;
      const bx = t.x + c*lx + s*lz, bz = t.z - s*lx + c*lz, by = t.y + 7.35;
      const ph2 = el2*1.9 + side + t.z*0.07;
      const pts = [];
      for (let i = 0; i <= N; i++) {
        const u = i/N;
        pts.push([ bx + u*L*0.92 + Math.sin(ph2 - u*4.6)*0.30*u,
                   by - u*u*0.55 + Math.sin(ph2*1.3 - u*3.8)*0.22*u,
                   bz + Math.cos(ph2 - u*4.1)*0.25*u ]);
      }
      for (let i = 0; i < N; i++) {
        const w0 = 0.30*(1 - (i/N)*0.55), w1 = 0.30*(1 - ((i+1)/N)*0.55);
        const a = pts[i], b2 = pts[i+1];
        const A=[a[0],a[1]+w0,a[2]], B=[a[0],a[1]-w0,a[2]];
        const C=[b2[0],b2[1]-w1,b2[2]], D=[b2[0],b2[1]+w1,b2[2]];
        m.quad(A,B,C,D, 0, 0); m.quad(D,C,B,A, 0, 0);
      }
    }
  }
  return m;
}

/* 앰버 티끌 — 랜턴 이후의 사막. 크롤러들입니다.
   자리는 시드 고정, 내 주위를 천천히 떠다닙니다. */
function buildMotes(el2, cx2, cz2) {
  const m = new FMesh();
  for (let i = 0; i < 24; i++) {
    const r = 7 + (i*97 % 23), a0 = i*2.399 + el2*(0.05 + (i%5)*0.012);
    const x = cx2 + Math.cos(a0)*r, z = cz2 + Math.sin(a0)*r;
    const y = height(x, z) + 1.0 + Math.sin(el2*0.8 + i*1.7)*0.45 + (i%3)*0.5;
    const s = 0.055 + (i%4)*0.02;
    m.tri([x-s,y,z],[x+s,y,z],[x,y+s*2.2,z], 0, 2);
    m.tri([x,y,z-s],[x,y,z+s],[x,y+s*2.2,z], 0, 2);
  }
  return m;
}

   뒤집혀서 절반이 안 보였으므로, 여기서는 면마다 바깥쪽으로 CCW를 맞춰 둡니다. */
function box(v, cx, cy, cz, a, bb, c) {
  const X=(s)=>cx+s*a, Y=(s)=>cy+s*bb, Z=(s)=>cz+s*c;
  const p=(sx,sy,sz)=>[X(sx),Y(sy),Z(sz)];
  const q=(A,B,C,D)=>{ v.push(...A,...B,...C, ...A,...C,...D); };
  q(p(1,-1,-1),p(1,1,-1),p(1,1,1),p(1,-1,1));       /* +X */
  q(p(-1,-1,1),p(-1,1,1),p(-1,1,-1),p(-1,-1,-1));   /* -X */
  q(p(-1,1,-1),p(-1,1,1),p(1,1,1),p(1,1,-1));       /* +Y */
  q(p(-1,-1,1),p(-1,-1,-1),p(1,-1,-1),p(1,-1,1));   /* -Y */
  q(p(-1,-1,1),p(1,-1,1),p(1,1,1),p(-1,1,1));       /* +Z */
  q(p(1,-1,-1),p(-1,-1,-1),p(-1,1,-1),p(1,1,-1));   /* -Z */
}

  /* 신전들 — 점. 들어가 본 곳은 빈 원이 됩니다 */
  for (const t of TEMPLES) {
    const p = clampRim(toMap(t.x, t.z), R-10);
    navG.beginPath(); navG.arc(p.x, p.y, p.clamped ? 3 : 4.5, 0, TAU);
    if (t.seen) { navG.lineWidth = 2; navG.strokeStyle = 'rgba(255,174,26,.85)'; navG.stroke(); }
    else { navG.fillStyle = p.clamped ? 'rgba(255,174,26,.55)' : 'rgba(255,174,26,.95)'; navG.fill(); }
  }

  /* 나 — 가운데 쐐기, 늘 위를 봅니다 */
  navG.beginPath(); navG.moveTo(0, -8); navG.lineTo(5.5, 6); navG.lineTo(-5.5, 6); navG.closePath();
  navG.fillStyle = 'rgba(255,246,230,.95)'; navG.fill();
  navG.restore();
}
function goIn(t) {
  inside = t; t.seen = true;
  document.getElementById('room-name').textContent = t.name;
  document.getElementById('room-why').textContent = t.why;   /* 문장에 이미 따옴표가 있어 겹따옴표가 됩니다 */
  document.getElementById('room-body').textContent = t.body;
  roomEl.classList.add('on');
  keys.f = keys.l = keys.r = false;      /* 안에서는 조작을 요구하지 않습니다 */
  enterEl.classList.remove('on');
}
let lantern = false, ended = false;
const finEl = document.getElementById('fin');
document.getElementById('fin-again').addEventListener('click', () => location.reload());
function goOut() {
  /* 들어온 문 앞으로 돌려세웁니다 — 제자리에 두면 문지방 위라서
     나오자마자 다시 들어가지는 무한문이 됩니다 */
  if (inside) {
    const t = inside;
    P0.x = t.x - 8.4*Math.sin(t.yaw); P0.z = t.z - 8.4*Math.cos(t.yaw);
    yaw = t.yaw + Math.PI; camYaw = yaw;
    /* 여섯 번째 신전에서 나오는 순간이 이 이야기의 전환점입니다.
       사막에 앰버 티끌이 떠오릅니다 — 그동안에도 계속 지나다니고 있었는데,
       이제야 보이는 것들. 원작(2D)의 랜턴 켜짐을 이 사막의 언어로 옮긴 것. */
    if (t.lantern && !lantern) {
      lantern = true;
      sayLine('그동안, 계속 읽히고 있었습니다 — 셀 방법이 없었을 뿐입니다', 8);
    }
  }
  inside = null; roomEl.classList.remove('on');
}

const K = (e, d) => {
  const k = e.key;
  if (ended) return;                     /* 엔딩 뒤에는 "다시 걷기" 버튼뿐 */
  if (inside) {                          /* 안에 있는 동안은 나가는 것 말고 아무것도 안 받습니다 */
    if (d && (k === 'Enter' || k === 'Escape')) { goOut(); e.preventDefault(); }
    return;
  }
  if (d && k === 'Enter' && nearT) { goIn(nearT); e.preventDefault(); return; }
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') keys.l = d;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = d;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') keys.f = d;
  else return;
  e.preventDefault();
};
addEventListener('keydown', e => K(e, true));
addEventListener('keyup',   e => K(e, false));
addEventListener('click', () => {

  lineEl.classList.remove('on');
  crowd.forEach((c, i) => {
    c.x = (Math.random()-0.5)*14; c.z = 12 + i*6 + Math.random()*4;
    c.veer = 0; c.yaw = (Math.random()-0.5)*0.10; c.hes = c.dly = undefined;
  });
});

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, cv.width, cv.height);

}
addEventListener('resize', resize); resize();

gl.enable(gl.DEPTH_TEST);
gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const el = performance.now() * 0.001;          /* 흔들림·걸음 위상용 시계 */

  /* ── 직접 걷습니다 — 미끄러지지 않고 ──
     등속 이동은 스케이트입니다. 걸음은 발을 디딜 때마다 속도가 맥동하고
     (밀 때 빠르고 발을 옮길 때 느리고), 몸이 좌우로 흔들립니다.
     위상은 시간이 아니라 걸어온 거리에 묶습니다 — 그래야 발과 땅이 붙습니다. */
  if (keys.l) yaw -= TURN * dt;
  if (keys.r) yaw += TURN * dt;
  const fx = Math.sin(yaw), fz = Math.cos(yaw);
  walkA += ((keys.f ? 1 : 0) - walkA) * Math.min(1, 4*dt);   /* 출발·정지를 부드럽게 */
  const ph = moved * 1.45;                                    /* 걸음 위상 = 거리 */

  /* 경사가 속도를 정합니다 — 사막이니까. 오르막은 무겁고(최저 0.55배)
     내리막은 모래에 실려 내려갑니다(최대 1.5배). 급히 바뀌지 않도록 걸러서,
     언덕 하나를 넘는 것이 "느려졌다가 훅 풀리는" 한 호흡이 됩니다. */
  const slopeF = (height(P0.x + fx*1.4, P0.z + fz*1.4) - height(P0.x - fx*0.4, P0.z - fz*0.4)) / 1.8;
  const glide = Math.max(0, Math.min(1, -slopeF*2.6));        /* 내리막 미끄러짐 정도 */
  /* 활강은 걷기가 아니라 다른 상태입니다: 오르막 최저 0.55배는 천천히 걸리고,
     내리막은 2.1배까지 빠르게 붙습니다 — 모래가 밀어주는 건 즉각적이어야
     "미끄러진다"로 느껴지고, 천천히 붙으면 그냥 빨리 걷기가 됩니다. */
  spdK += (Math.max(.55, Math.min(2.1, 1 - slopeF*2.1)) - spdK)
          * Math.min(1, (glide > .1 ? 5.0 : 2.5)*dt);
  const steer = (keys.r?1:0) - (keys.l?1:0);

  if (keys.f) {
    /* 맥동은 있되 들리지 않게: 0.4 진폭 |sin| 은 로봇 걸음이었습니다.
       sin² 라 꺾임이 없고, 활강에선 걸음 자체가 사라집니다 — 발이 땅을 안 딛으니까. */
    const ox = P0.x, oz = P0.z;
    const s2 = Math.sin(ph)*Math.sin(ph);
    const pulse = (0.93 + 0.13*s2) * (1 - glide*0.7) + glide*1.15;
    const v = SPEED * spdK * pulse;
    P0.x += fx * v * dt; P0.z += fz * v * dt;
    /* 활강 중 조향은 걷는 회전이 아니라 카빙 — 옆으로 실제로 흘러갑니다 */
    if (glide > .05 && steer) {
      P0.x += fz * steer * glide * v * 0.30 * dt;
      P0.z += -fx * steer * glide * v * 0.30 * dt;
    }
    /* 돌은 돌입니다 — 벽은 막히고, 축을 나눠 풀어서 벽을 따라 미끄러집니다.
       막힌 채로 서 버리면 벽에 붙을 때마다 걸음이 뚝 끊깁니다. */
    if (templeBlock(P0.x, P0.z)) {
      if (!templeBlock(P0.x, oz)) P0.z = oz;
      else if (!templeBlock(ox, P0.z)) P0.x = ox;
      else { P0.x = ox; P0.z = oz; }
    }
    moved += v * dt;
  }
  /* 문으로 걸어 들어가면 그대로 들어가집니다 — Enter 를 기다리지 않습니다.
     문 앞에서 키를 누르는 건 "읽으시겠습니까"이고, 문지방을 넘는 건 이미 대답입니다. */
  if (!inside) for (const t of TEMPLES) {
    const l = templeLocal(P0.x, P0.z, t);
    if (Math.abs(l.x) < 1.5 && l.z > -4.3 && l.z < 3.5) { goIn(t); break; }
  }
  /* 산기슭 — 끝. Hospify 를 지나 산 아래 이르면 이야기가 닫힙니다 */
  if (!ended && !inside && Math.hypot(P0.x - MOUNTAIN.x, P0.z - (MOUNTAIN.z - 12)) < 26) {
    ended = true;
    keys.f = keys.l = keys.r = false;
    document.getElementById('fin-cnt').textContent =
      '들어가 본 신전 ' + TEMPLES.filter(t => t.seen).length + ' / 8';
    finEl.classList.add('on');
  }
  cues();
  hintEl.style.opacity = moved > 6 ? 0 : 1;
  navCv.classList.toggle('on', moved > 4 && !inside);
  if (moved > 4 && !inside) drawNav();

  /* 제일 가까운 신전. 문간 쪽에서 다가와야 들어갈 수 있습니다 — 뒷벽에
     붙어서 들어가지는 것보다, 돌아 들어가는 편이 유적답습니다. */
  nearT = null;
  if (!inside) {
    let best = 1e9;
    for (const t of TEMPLES) {
      const dx = P0.x - t.x, dz = P0.z - t.z, d = Math.hypot(dx, dz);
      const front = -(dx*Math.sin(t.yaw) + dz*Math.cos(t.yaw));   /* 문간은 로컬 -z */
      if (d < 16 && front > 1 && d < best) { best = d; nearT = t; }
    }
  }
  /* 빈 문틀 앞 — 이름도 ⏎ 도 없이 그 한 줄만 */
  const vd = Math.hypot(P0.x - VOIDF.x, P0.z - VOIDF.z);
  enterEl.innerHTML = nearT ? (nearT.name + ' <kbd>⏎</kbd> 들어가기')
                    : vd < 9 ? '이 문은 열리지 않습니다 — 만들어 놓고 지웠습니다' : '';
  enterEl.classList.toggle('on', !!nearT || vd < 9);

  const px = P0.x, pz = P0.z, py = height(px, pz);
  /* 걸음의 몸: 바운스·흔들림 모두 반으로 줄이고 내리막에선 더 잦아듭니다 —
     활강 중에 몸이 뚝딱거리면 그 순간 걷기가 아니라 기계가 됩니다.
     전부 위상 ph(거리)에 묶여 있어 발과 땅이 밀리지 않습니다. */
  const calm  = 1 - glide*0.85;                          /* 활강 중엔 걸음의 몸짓이 거의 사라짐 */
  const walk  = walkA * Math.abs(Math.sin(ph)) * 0.038 * calm - glide*0.05;  /* 모래에 살짝 가라앉음 */
  const rock  = walkA * Math.sin(ph) * 0.026 * calm
              + steer * glide * 0.10;                    /* 카빙 — 조향 쪽으로 기욺 */
  const pitchG= walkA * (0.045 + glide*0.12);            /* 활강에선 몸이 실림 */
  /* 지형 기울기 따라 눕기 — 언덕을 오르는데 몸이 수직이면 그게 곧 "떠 있음"입니다 */
  const gAlong = (height(px+fx*.6, pz+fz*.6) - height(px-fx*.6, pz-fz*.6)) / 1.2;
  const gSide  = (height(px+fz*.6, pz-fx*.6) - height(px-fz*.6, pz+fx*.6)) / 1.2;
  const tPitch = Math.max(-.30, Math.min(.30, Math.atan(gAlong)*0.55));
  const tRoll  = Math.max(-.25, Math.min(.25, Math.atan(gSide)*0.45));

  /* ── 카메라 ──
     저니의 절반은 이것인데, 어지럽지 않게 만드는 것도 절반은 이것입니다.
       · 지형을 1:1로 따라가지 않고 평균 높이를 천천히 좇습니다
       · 시선은 인물이 아니라 앞쪽 한 점을 보므로 지평선이 출렁이지 않습니다
       · 화각을 52도에서 44도로 좁혔습니다. 넓은 화각은 주변부가 빨리 흘러서
         그 자체로 멀미를 만듭니다
       · 방향 전환도 카메라가 조금 늦게 따라옵니다 */
  camYaw += Math.atan2(Math.sin(yaw - camYaw), Math.cos(yaw - camYaw)) * Math.min(1, 3.0*dt);
  const cfx = Math.sin(camYaw), cfz = Math.cos(camYaw);

  const wide = Math.min(1, Math.max(0, (zProg - 56)/20)) * (1 - Math.min(1, Math.max(0, (zProg - 96)/24)));
  camBack += (7.8 + wide*12.0 - camBack) * 0.8 * dt;
  camUp   += (3.0 + wide*6.0  - camUp)   * 0.8 * dt;

  const cx = px - cfx*camBack, cz = pz - cfz*camBack;
  const want = groundAvg(cx, cz, cfx, cfz) + camUp;
  if (!camY) camY = want;
  camY += (want - camY) * Math.min(1, 1.3*dt);
  camY = Math.max(camY, height(cx, cz) + 1.4);   /* 절대 땅을 뚫지 않습니다 */

  const eye = [cx, camY, cz];
  const look = [px + cfx*16, groundAvg(px, pz, cfx, cfz) + 1.9 + wide*1.2, pz + cfz*16];
  /* 근평면 0.4 · 원평면 2600 은 비율이 6500:1 이라 깊이 정밀도가 남아나지 않고,
     겹치지 않은 벽면끼리도 지글거립니다. 카메라는 인물보다 7.8 뒤에 있으니
     1.2 로 밀어도 잘리는 게 없고, 정밀도는 다섯 배쯤 벌어집니다. */
  const VP = mul(perspective(Math.PI/180*44, cv.width/cv.height, 1.2, 2400), lookAt(eye, look, [0,1,0]));

  /* 장면 전체를 MSAA 프레임버퍼로 — 화면에는 후처리를 거쳐서만 나갑니다 */
  gl.bindFramebuffer(gl.FRAMEBUFFER, post.fboMS);
  gl.viewport(0, 0, post.W2, post.H2);

  /* 하늘 */
  gl.depthMask(false);
  gl.useProgram(skyProg);
  gl.uniform3fv(uni.sky.haze, P.haze); gl.uniform3fv(uni.sky.high, P.high);
  gl.uniform1f(uni.sky.sunX, 0.5 - camYaw*0.28);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.depthMask(true);
  gl.clear(gl.DEPTH_BUFFER_BIT);

  /* 산 — 월드에 못박혀 있습니다. 카메라를 따라다니게 두면 아무리 걸어도
     제자리라 방향 감각을 못 줍니다. 어디로 가는지는 이 산이 알려줍니다. */
  gl.useProgram(farProg);
  gl.uniformMatrix4fv(uni.far.vp, false, VP);
  gl.uniformMatrix4fv(uni.far.model, false, trs(MOUNTAIN.x, -11, MOUNTAIN.z, 0, 68));
  gl.uniform3fv(uni.far.cam, eye);
  gl.uniform3fv(uni.far.haze, P.haze); gl.uniform3fv(uni.far.tint, P.mtn);
  gl.uniform1f(uni.far.mix, 0.30);
  gl.bindVertexArray(mountain.vao); gl.drawArrays(gl.TRIANGLES, 0, mountain.n);

  /* 지형 */
  gl.useProgram(lit);
  gl.uniformMatrix4fv(uni.lit.vp, false, VP);
  gl.uniform3fv(uni.lit.cam, eye); gl.uniform3fv(uni.lit.sun, P.sun);
  gl.uniform3fv(uni.lit.haze, P.haze); gl.uniform1f(uni.lit.fog, 0.0000128);
  gl.uniform2f(uni.lit.pxz, px, pz); gl.uniform1f(uni.lit.py, py);
  gl.uniform1f(uni.lit.time, el);
  gl.uniform3fv(uni.lit.litc, P.lit); gl.uniform3fv(uni.lit.dark, P.dark);
  gl.uniform1f(uni.lit.glit, 1.0);
  gl.uniform1i(uni.lit.terrain, 1);
  /* 칸 단위로 스냅합니다. 이게 없으면 정점이 매 프레임 지형 위를 미끄러지고,
     플랫셰이딩이라 바닥 전체의 면이 계속 갈아치워지면서 잘게 기어다닙니다. */
  gl.uniform2f(uni.lit.origin, Math.round(cx/CELL)*CELL, Math.round(cz/CELL)*CELL);
  gl.bindVertexArray(terrain.vao); gl.drawArrays(gl.TRIANGLES, 0, terrain.n);

  /* 신전 */
  gl.uniform1i(uni.lit.terrain, 0);
  gl.uniform1f(uni.lit.glit, 0.0);
  /* 신전은 사막과 같은 돌입니다: 볕 면은 모래의 주황 가족, 그늘은 지형과
     같은 차가운 보라. 베이지 상자였을 때 "배경에 오려붙인 건물"로 보였던
     이유가 이 두 상수였습니다. */
  gl.uniform3fv(uni.lit.litc, [0.88,0.56,0.28]);
  gl.uniform3fv(uni.lit.dark, [0.235,0.15,0.20]);
  gl.bindVertexArray(templeMesh.vao);
  for (const t of TEMPLES) {
    gl.uniformMatrix4fv(uni.lit.model, false, mul(trs(t.x, t.y, t.z, t.yaw, 1), rotZ(t.tilt)));
    gl.drawArrays(gl.TRIANGLES, 0, templeMesh.n);
  }
  gl.uniform1f(uni.lit.emit, 1.0);
  gl.uniform3fv(uni.lit.litc, [0.86, 0.52, 0.19]);
  gl.bindVertexArray(templeGlow.vao);
  for (const t of TEMPLES) {
    gl.uniformMatrix4fv(uni.lit.model, false, mul(trs(t.x, t.y, t.z, t.yaw, 1), rotZ(t.tilt)));
    gl.drawArrays(gl.TRIANGLES, 0, templeGlow.n);
  }
  /* 모래 둔덕 — 사막과 같은 모래색, 지형과 같은 그늘.
     이 지점은 발광(emit=1) 블록 한가운데라, 껐다가 문양 전에 다시 켭니다 */
  gl.uniform1f(uni.lit.emit, 0.0);
  gl.uniform3fv(uni.lit.litc, [0.97, 0.615, 0.245]);
  gl.uniform3fv(uni.lit.dark, [0.21, 0.13, 0.175]);
  gl.bindVertexArray(templeSkirt.vao);
  for (const t of TEMPLES) {
    gl.uniformMatrix4fv(uni.lit.model, false, trs(t.x, t.y + 1.05, t.z, t.yaw, 1));
    gl.drawArrays(gl.TRIANGLES, 0, templeSkirt.n);
  }
  gl.uniform1f(uni.lit.emit, 1.0);
  /* 벽의 눈금 문양 — 문간 빛보다 어둡게 */
  gl.uniform3fv(uni.lit.litc, [0.48, 0.28, 0.10]);
  gl.bindVertexArray(templeGlyphs.vao);
  for (const t of TEMPLES) {
    gl.uniformMatrix4fv(uni.lit.model, false, mul(trs(t.x, t.y, t.z, t.yaw, 1), rotZ(t.tilt)));
    gl.drawArrays(gl.TRIANGLES, 0, templeGlyphs.n);
  }
  gl.uniform1f(uni.lit.emit, 0.0);
  /* 빈 문틀 — 불도 안 켜지고, 들어가지지도 않습니다. 볕을 덜 받는 죽은 돌 */
  gl.uniform3fv(uni.lit.litc, [0.52,0.38,0.30]);
  gl.uniform3fv(uni.lit.dark, [0.16,0.11,0.17]);
  gl.bindVertexArray(voidMesh.vao);
  gl.uniformMatrix4fv(uni.lit.model, false, trs(VOIDF.x, VOIDF.y, VOIDF.z, VOIDF.yaw, 1));
  gl.drawArrays(gl.TRIANGLES, 0, voidMesh.n);

  /* ── 인물들 — 06의 조각과 조명으로 ── */
  gl.useProgram(figProg);
  gl.uniformMatrix4fv(uniFig.vp, false, VP);
  gl.uniform3fv(uniFig.cam, eye);
  gl.uniform3fv(uniFig.haze, P.haze);
  gl.uniform1f(uniFig.fog, 0.0000128);
  gl.disable(gl.CULL_FACE);               /* 옷단 안쪽·스카프 뒷면이 보여야 합니다 */

  /* 무리 — 같은 조각, 색만 회청이고 띠가 없습니다. 그 차이가 곧 "나"입니다.
     걸음 위상은 하나로 공유합니다: 개별 위상은 메시를 사람 수만큼 다시
     조각하는 값인데, 이 거리에선 아무도 못 알아봅니다. */
  const crowdFig = buildFigure(1, el*3.0 + 1.7, true);
  slotCrowd.set(crowdFig);
  gl.uniform3fv(uniFig.c0, FIG_CROWD.c0); gl.uniform3fv(uniFig.c1, FIG_CROWD.c1);
  gl.uniform3fv(uniFig.c2, FIG_CROWD.c2); gl.uniform3fv(uniFig.c3, FIG_CROWD.c3);
  gl.bindVertexArray(slotCrowd.vao);
  /* 갈라짐은 "각자 슬금슬금"이 아니라 하나의 사건입니다.
     예전엔 55 지점부터 개인 타이머로 6초에 걸쳐 흐물흐물 휘어서, 흩어지는 게
     아니라 배회하는 걸로 읽혔습니다 — "쟤들 뭐지"가 그래서 나왔습니다.
     지금은 "굳이? 왜?" 자막이 뜨는 그 지점에서, 2초 안에, 전원이 같은
     오른쪽으로 결단하듯 꺾어 능선을 넘어갑니다. 떠나는 자는 걸음도 빨라집니다.
     그리고 딱 한 명 — 맨 앞의 하나가 멈춰 서서 나를 돌아봅니다.
     "굳이? 왜?"를 몸으로 묻고, 대답을 기다리지 않고 무리를 따라갑니다. */
  const SPLIT = 70;                            /* "굳이? 왜?" 자막과 같은 지점(z) */
  for (const c of crowd) {
    if (zProg > SPLIT) {
      if (c === crowd[0] && c.hes === undefined) c.hes = 2.6;   /* 묻는 사람 */
      if (c.hes > 0) c.hes -= dt;
      else {
        if (c.dly === undefined) c.dly = c.t * 0.35;            /* 0~2초 시차 */
        c.dly = Math.max(0, c.dly - dt);
        if (c.dly === 0) c.veer = Math.min(1, c.veer + dt*0.55);
      }
    }
    let heading = c.yaw + c.veer * 1.35;                        /* 75도 — 결단의 각도 */
    let spd = SPEED * (0.93 + c.veer * 0.25);
    if (c.hes > 0) { spd = 0; heading = Math.atan2(px - c.x, pz - c.z); }
    c.x += Math.sin(heading) * spd * dt;
    c.z += Math.cos(heading) * spd * dt;
    const dx = c.x - cx, dz = c.z - cz;
    if (dx*cfx + dz*cfz < 1.5) continue;    /* 등 뒤나 코앞의 하나가 장면을 다 망칩니다 */
    /* +π: 06 조각은 얼굴이 로컬 -z 인데 이 월드는 +z 가 전진입니다.
       무리도 걷습니다 — 서 있는 사람은 바운스 없이 서 있습니다. */
    const cph = el*3.0 + c.t*7, mv = spd > 0 ? 1 : 0;
    gl.uniformMatrix4fv(uniFig.m, false,
      mul(trs(c.x, height(c.x, c.z) + Math.abs(Math.sin(cph))*0.05*mv, c.z, heading + Math.PI, 1),
          rotZ(Math.sin(cph)*0.04*mv)));
    gl.drawArrays(gl.TRIANGLES, 0, slotCrowd.n);
  }

  /* 나 — 걸을 때만 옷단이 차이고, 서면 천이 가라앉습니다 */
  const meFig = buildFigure(walkA, ph, false);   /* 옷단 차임도 거리 위상에 */
  slotMe.set(meFig);
  gl.uniform3fv(uniFig.c0, FIG_ME.c0); gl.uniform3fv(uniFig.c1, FIG_ME.c1);
  gl.uniform3fv(uniFig.c2, FIG_ME.c2); gl.uniform3fv(uniFig.c3, FIG_ME.c3);
  /* +π: 06 조각은 얼굴이 로컬 -z. 회전 순서: 지형에 눕고 → 걸음 기울기 → 흔들림.
     +π 를 돌면 로컬 x·z 부호가 뒤집히므로 피치는 부호를 뒤집어 얹습니다. */
  const me = mul(trs(px, py + walk, pz, yaw + Math.PI, 1),
                 mul(rotX(-(tPitch + pitchG)), rotZ(rock - tRoll)));
  gl.uniformMatrix4fv(uniFig.m, false, me);
  gl.bindVertexArray(slotMe.vao);
  gl.drawArrays(gl.TRIANGLES, 0, slotMe.n);

  /* 스카프 — 서 있으면 가라앉습니다. 바람은 내가 만드는 거니까 */
  const seenN = TEMPLES.filter(t => t.seen).length;
  slotScarf.set(buildScarfMesh(el, walkA > .5 ? 1 + glide*0.5 : 0.28, seenN*0.22));
  gl.uniformMatrix4fv(uniFig.m, false, me);
  gl.bindVertexArray(slotScarf.vao);
  gl.drawArrays(gl.TRIANGLES, 0, slotScarf.n);

  /* 랜턴 이후 — 크롤러 티끌 */
  if (lantern) {
    slotMotes.set(buildMotes(el, px, pz));
    gl.uniformMatrix4fv(uniFig.m, false, ident());
    gl.bindVertexArray(slotMotes.vao);
    gl.drawArrays(gl.TRIANGLES, 0, slotMotes.n);
  }
  /* 신전 깃발 — 로브보다 바랜 천 색 */
  slotBanner.set(buildBanners(el));
  if (slotBanner.n) {
    gl.uniform3fv(uniFig.c0, [0.80, 0.26, 0.16]);   /* 로브와 같은 적 가족, 조금 바램 */
    gl.uniformMatrix4fv(uniFig.m, false, ident());
    gl.bindVertexArray(slotBanner.vao);
    gl.drawArrays(gl.TRIANGLES, 0, slotBanner.n);
  }
  gl.enable(gl.CULL_FACE);

  /* ── 후처리 체인 ── */
  gl.disable(gl.DEPTH_TEST);
  /* MSAA 를 일반 텍스처로 해상 */
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, post.fboMS);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, post.scene.f);
  gl.blitFramebuffer(0, 0, post.W2, post.H2, 0, 0, post.W2, post.H2, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  /* 밝은 곳 추출 (1/4 해상도) */
  gl.bindFramebuffer(gl.FRAMEBUFFER, post.b1.f);
  gl.viewport(0, 0, post.W4, post.H4);
  gl.useProgram(brightProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, post.scene.t);
  gl.uniform1i(uniPost.bT, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  /* 가로 블러 → 세로 블러 */
  gl.useProgram(blurProg);
  gl.uniform1i(uniPost.uT, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, post.b2.f);
  gl.bindTexture(gl.TEXTURE_2D, post.b1.t);
  gl.uniform2f(uniPost.uD, 1/post.W4, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, post.b1.f);
  gl.bindTexture(gl.TEXTURE_2D, post.b2.t);
  gl.uniform2f(uniPost.uD, 0, 1/post.H4);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  /* 합성 — 톤매핑·그레이딩·색수차·그레인·비네트, 감마는 여기서 한 번 */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, post.W2, post.H2);
  gl.useProgram(finalProg);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, post.scene.t);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, post.b1.t);
  gl.uniform1i(uniPost.fT, 0); gl.uniform1i(uniPost.fB, 1);
  gl.uniform1f(uniPost.fTime, el);
  gl.uniform2f(uniPost.fPx, 1/post.W2, 1/post.H2);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);
  gl.enable(gl.DEPTH_TEST);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
